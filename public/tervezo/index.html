<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <title>Tervező · Szikszai Zsu</title>
  <link rel="icon" href="/assets/favicon.png?v=sz-logo-1">
  <style>
    @font-face { font-family: "Inter"; src: url("/assets/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("/assets/cormorant-garamond-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("/assets/cormorant-garamond-latin-ext.woff2") format("woff2"); font-weight: 300 700; font-display: swap; unicode-range: U+0100-024F, U+1E00-1EFF; }

    :root {
      --bg: #141414;
      --side: #181818;
      --card: #1e1e1e;
      --card-hover: #252525;
      --line: rgba(255, 255, 255, .07);
      --text: #f2efe9;
      --soft: rgba(242, 239, 233, .55);
      --muted: rgba(242, 239, 233, .38);
      --accent: #c8f04a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 400 15px/1.5 Inter, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
    .layout > * { min-width: 0; }
    @media (min-width: 860px) { .layout { grid-template-columns: 260px minmax(0, 1fr); } }

    /* Sidebar */
    aside {
      background: var(--side);
      border-bottom: 1px solid var(--line);
      padding: 20px 16px 12px;
    }
    @media (min-width: 860px) {
      aside { position: sticky; top: 0; height: 100vh; border-bottom: 0; border-right: 1px solid var(--line); padding: 28px 18px; }
    }
    .profile { display: flex; align-items: center; gap: 12px; }
    .profile img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #2a2a2a; }
    .profile b { display: block; font-weight: 600; font-size: 15px; letter-spacing: .01em; }
    .profile span { display: block; font-size: 13px; color: var(--soft); }

    .label { margin: 30px 10px 10px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    nav ul { list-style: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    nav ul::-webkit-scrollbar { display: none; }
    @media (min-width: 860px) { nav ul { flex-direction: column; gap: 2px; margin: 0; padding: 0; overflow: visible; } }
    nav a {
      display: flex; align-items: center; gap: 10px; white-space: nowrap;
      padding: 9px 12px; border-radius: 10px;
      font-size: 14px; color: var(--soft);
      transition: background .2s, color .2s;
    }
    nav a:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
    nav a[aria-current="page"] { color: var(--text); background: rgba(255, 255, 255, .07); }
    nav svg { width: 16px; height: 16px; flex: none; opacity: .8; }
    nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
    @media (max-width: 859px) { nav .count { display: none; } }

    .home { display: none; }
    @media (min-width: 860px) {
      .home { display: block; position: absolute; bottom: 24px; left: 28px; font: 600 13px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
      .home:hover { color: var(--text); }
    }

    /* Main */
    main { padding: 28px 16px 80px; }
    @media (min-width: 860px) { main { padding: 48px 48px 96px; } }
    .inner { max-width: 760px; margin: 0 auto; }

    .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    h1 { font: 500 clamp(36px, 5vw, 52px)/1 "Cormorant Garamond", Georgia, serif; }
    .search {
      width: 100%; max-width: 260px; min-width: 0;
      padding: 10px 14px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--text); font: inherit; font-size: 14px; outline: none;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: rgba(200, 240, 74, .5); }

    .list { display: grid; gap: 10px; }
    .item {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 18px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--line);
      transition: background .2s, transform .2s;
    }
    .item:hover { background: var(--card-hover); transform: translateY(-1px); }
    .ico {
      width: 40px; height: 40px; flex: none; border-radius: 10px;
      display: grid; place-items: center; overflow: hidden;
      background: #fff; color: #141414; font-weight: 700; font-size: 16px;
    }
    .ico img { width: 26px; height: 26px; object-fit: contain; }
    .txt { min-width: 0; flex: 1; }
    .txt b { display: block; font-weight: 600; font-size: 15px; }
    .txt span { display: block; font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arrow { width: 18px; height: 18px; flex: none; color: var(--muted); transition: color .2s, transform .2s; }
    .item:hover .arrow { color: var(--accent); transform: translate(2px, -2px); }

    .empty { padding: 40px 0; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <a class="profile" href="/tervezo/">
        <img src="/assets/portrait-headshot.webp" alt="">
        <div><b>Szikszai Zsu</b><span>Tervező</span></div>
      </a>
      <p class="label">Források</p>
      <nav><ul id="nav"></ul></nav>
      <a class="home" href="/">szikszaizsu.com</a>
    </aside>

    <main>
      <div class="inner">
        <div class="head">
          <h1 id="title">Hasznos linkek</h1>
          <input class="search" id="search" type="search" placeholder="Keresés…" aria-label="Keresés a linkek között">
        </div>
        <div class="list" id="list"></div>
      </div>
    </main>
  </div>

  <script>
    // Ide kerülnek a linkek. Új link: { name, desc, url } a megfelelő kategóriába.
    const CATEGORIES = [
      { id: "hasznos-linkek", name: "Hasznos linkek", icon: "link", links: [
        { name: "Fontshare", desc: "Ingyenes, nagyon jó minőségű betűk", url: "https://www.fontshare.com/" },
        { name: "Free Faces", desc: "Szép, ingyenes betűtípusok gyűjteménye", url: "https://www.freefaces.gallery/" },
        { name: "Radix Colors", desc: "Weboldal színpaletta tesztelő", url: "https://www.radix-ui.com/colors/custom" },
        { name: "Envato Elements", desc: "Alapanyag mindenhez", url: "https://elements.envato.com/" },
        { name: "Coolors", desc: "Színpaletta generátor", url: "https://coolors.co/" },
        { name: "Squoosh", desc: "Képtömörítés a böngészőben", url: "https://squoosh.app/" }
      ]},
      { id: "grafika", name: "Grafika és ikonok", icon: "pen", links: [
        { name: "Minimal Mockups", desc: "Sok jó, ingyenes mockup", url: "https://www.minimalmockups.com/" },
        { name: "Tabler Icons", desc: "5600+ vektor ikon", url: "https://tabler.io/icons" },
        { name: "Phosphor Icons", desc: "Minőségi vektor ikonok", url: "https://phosphoricons.com/" },
        { name: "Lordicon", desc: "Animált ikonkészlet", url: "https://lordicon.com/" },
        { name: "Google Fonts Icons", desc: "Material Symbols ikonok", url: "https://fonts.google.com/icons" }
      ]},
      { id: "ai", name: "AI", icon: "spark", links: [
        { name: "Magnific", desc: "Képnagyítás, nagy felbontás", url: "https://magnific.ai/" },
        { name: "ElevenLabs", desc: "Narráció, hang", url: "https://elevenlabs.io/" },
        { name: "Claude", desc: "Szöveg, kód, ötletelés", url: "https://claude.ai/" }
      ]},
      { id: "promptok", name: "Promptok", icon: "note", links: [] }
    ];

    const ICONS = {
      link: '<path d="M9 15l6-6M10.5 6.5l1.8-1.8a4 4 0 0 1 5.7 5.7l-1.8 1.8M13.5 17.5l-1.8 1.8a4 4 0 0 1-5.7-5.7l1.8-1.8"/>',
      pen: '<path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 6l3 3"/>',
      spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>',
      note: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/>'
    };
    const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const navEl = document.getElementById("nav");
    const listEl = document.getElementById("list");
    const titleEl = document.getElementById("title");
    const searchEl = document.getElementById("search");

    navEl.innerHTML = CATEGORIES.map((c) =>
      `<li><a href="#${c.id}" data-id="${c.id}">${svg(ICONS[c.icon])}${esc(c.name)}<span class="count">${c.links.length}</span></a></li>`
    ).join("");

    function current() {
      const id = location.hash.slice(1);
      return CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
    }

    function render() {
      const cat = current();
      const q = searchEl.value.trim().toLowerCase();
      // Kereséskor minden kategóriában keres, nem csak az aktuálisban.
      const links = q
        ? CATEGORIES.flatMap((c) => c.links).filter((l) => (l.name + " " + l.desc + " " + l.url).toLowerCase().includes(q))
        : cat.links;

      titleEl.textContent = q ? "Keresés" : cat.name;
      document.title = (q ? "Keresés" : cat.name) + " · Tervező · Szikszai Zsu";
      navEl.querySelectorAll("a").forEach((a) => {
        if (!q && a.dataset.id === cat.id) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });

      if (!links.length) {
        listEl.innerHTML = `<p class="empty">${q ? "Nincs találat." : "Ide hamarosan kerülnek linkek."}</p>`;
        return;
      }
      listEl.innerHTML = links.map((l) => {
        const host = new URL(l.url).hostname;
        return `<a class="item" href="${esc(l.url)}" target="_blank" rel="noopener">
          <span class="ico" data-letter="${esc(l.name[0])}"><img src="https://www.google.com/s2/favicons?domain=${host}&sz=64" alt="" loading="lazy"></span>
          <span class="txt"><b>${esc(l.name)}</b><span>${esc(l.desc)}</span></span>
          ${svg('<path d="M7 17L17 7M8 7h9v9"/>').replace("<svg", '<svg class="arrow"')}
        </a>`;
      }).join("");
      listEl.querySelectorAll(".ico img").forEach((img) => {
        img.addEventListener("error", () => { img.parentElement.textContent = img.parentElement.dataset.letter; });
      });
    }

    window.addEventListener("hashchange", () => { searchEl.value = ""; render(); });
    searchEl.addEventListener("input", render);
    render();
  </script>
</body>
</html>
