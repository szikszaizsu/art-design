<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <title>Tervező</title>
  <link rel="icon" type="image/png" href="/tervezo/favicon.png?v=ex-1"><link rel="apple-touch-icon" href="/tervezo/favicon.png?v=ex-1">
  <script>try { if (localStorage.getItem("tervezo-tema") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
  <style>
    @font-face { font-family: "Inter"; src: url("/assets/inter-variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("/assets/cormorant-garamond-latin.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("/assets/cormorant-garamond-latin-ext.woff2") format("woff2"); font-weight: 300 700; font-display: swap; unicode-range: U+0100-024F, U+1E00-1EFF; }

    :root {
      --bg: #ffffff;
      --dot: #c9cdd4;
      --panel: rgba(255, 255, 255, .92);
      --card: #ffffff;
      --card-hover: #f7f8fa;
      --field: #ffffff;
      --line: rgba(17, 20, 26, .1);
      --line-strong: rgba(17, 20, 26, .2);
      --text: #171a20;
      --soft: rgba(23, 26, 32, .62);
      --muted: rgba(23, 26, 32, .42);
      --accent: #8fb3e8;
      --accent-strong: #3d6fb8;
      --accent-ink: #0f1726;
      --danger: #c24848;
      --shadow: 0 1px 2px rgba(17, 20, 26, .04), 0 6px 18px rgba(17, 20, 26, .05);
      --shadow-big: 0 20px 50px rgba(17, 20, 26, .08);
      --ghost: #ffffff;
      --ghost-hover: #f3f4f6;
      --tint: rgba(17, 20, 26, .05);
      --backdrop: rgba(17, 20, 26, .35);
      color-scheme: light;
    }
    /* Sötét téma (a fodorvincent.com/weboldalak/ színei) */
    :root[data-theme="dark"] {
      --bg: #12151b;
      --dot: rgba(255, 255, 255, .13);
      --panel: rgba(22, 26, 33, .94);
      --card: #191e26;
      --card-hover: #1f2530;
      --field: #14181e;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .2);
      --text: #e6ebf3;
      --soft: rgba(230, 235, 243, .62);
      --muted: rgba(230, 235, 243, .4);
      --accent-strong: #8fb3e8;
      --danger: #e88f8f;
      --shadow: none;
      --shadow-big: 0 20px 50px rgba(0, 0, 0, .35);
      --ghost: transparent;
      --ghost-hover: rgba(255, 255, 255, .06);
      --tint: rgba(255, 255, 255, .06);
      --backdrop: rgba(5, 7, 10, .7);
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font: 400 15px/1.5 Inter, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    input, select, textarea {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      background: var(--field); border: 1px solid var(--line-strong);
      color: var(--text); font: inherit; outline: none;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: filter .2s, background .2s; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { border: 1px solid var(--line-strong); color: var(--soft); background: var(--ghost); }
    .btn-ghost:hover { color: var(--text); background: var(--ghost-hover); }
    .btn-danger { color: var(--danger); border: 1px solid var(--danger); background: var(--ghost); }
    .btn:disabled { opacity: .5; cursor: default; }

    /* Login */
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .gate form { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; display: grid; gap: 14px; box-shadow: var(--shadow-big); }
    .gate h1 { font: 500 34px/1 "Cormorant Garamond", Georgia, serif; }
    .gate p { color: var(--soft); font-size: 14px; }
    .gate .btn { padding: 12px; font-size: 16px; }
    .error, .gate .error { color: var(--danger); font-size: 13px; }
    .error:empty { display: none; }

    /* App */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
    .layout > * { min-width: 0; }
    @media (min-width: 860px) { .layout { grid-template-columns: 290px minmax(0, 1fr); } }

    aside { background: var(--panel); border-bottom: 1px solid var(--line); padding: 20px 16px 12px; }
    @media (min-width: 860px) { aside { position: sticky; top: 0; height: 100vh; border-bottom: 0; border-right: 1px solid var(--line); padding: 28px 18px; display: flex; flex-direction: column; } }
    .profile { display: flex; align-items: center; gap: 12px; }
    .profile img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--tint); }
    .profile b { display: block; font-weight: 600; font-size: 15px; }
    .profile span { display: block; font-size: 13px; color: var(--soft); }

    .label { margin: 30px 10px 10px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    nav ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    nav a { display: flex; align-items: center; gap: 10px; white-space: nowrap; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--soft); transition: background .2s, color .2s; }
    nav a:hover { color: var(--text); background: var(--tint); }
    nav a[aria-current="page"] { color: var(--text); background: rgba(143, 179, 232, .2); }
    nav svg { width: 16px; height: 16px; flex: none; opacity: .85; }
    nav .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    @media (min-width: 860px) { nav a { white-space: normal; line-height: 1.3; } nav .count { flex: none; padding-left: 6px; } }
    nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
    /* Telefonon a kategóriák egy lenyíló panelben vannak, a gomb a mostani kategóriát mutatja. */
    .nav-toggle { display: none; }
    @media (max-width: 859px) {
      aside { position: relative; }
      #nav-label, aside nav, aside .add-cat { display: none; }
      .nav-toggle {
        display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 16px;
        padding: 12px 14px; border-radius: 12px; text-align: left;
        background: var(--card); border: 1px solid var(--line-strong); color: var(--text); font-weight: 600; font-size: 15px;
      }
      .nav-toggle svg { width: 18px; height: 18px; flex: none; }
      .nav-toggle .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-toggle .chev { color: var(--soft); transition: transform .2s; }
      aside.nav-open .nav-toggle .chev { transform: rotate(180deg); }
      aside.nav-open nav { display: block; margin-top: 8px; max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; }
      aside.nav-open .add-cat:not([hidden]) { display: flex; }
      nav li.group { display: block; margin: 14px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
      nav li.group:first-child { margin-top: 4px; }
      nav a { padding: 11px 12px; font-size: 15px; white-space: normal; }
    }
    @media (min-width: 860px) {
      nav li.group { display: block; margin: 18px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
      nav li.group:first-child { margin-top: 28px; }
      aside { overflow-y: auto; overflow-x: hidden; }
    }
    .add-cat { margin-top: 8px; width: 100%; justify-content: flex-start; padding: 9px 12px; font-weight: 500; }

    .side-foot { display: none; }
    @media (min-width: 860px) { .side-foot { display: grid; gap: 8px; margin-top: auto; } }

    main { padding: 24px 16px 80px; }
    @media (min-width: 860px) { main { padding: 48px 48px 96px; } }
    .inner { max-width: 780px; margin: 0 auto; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 20px; padding-right: 52px; }
    @media (max-width: 859px) { .toolbar { padding-right: 0; } }

    /* Interaktív pontrács: az egér körül a pontok kitérnek és szivárványszínben felvillannak. */
    .dots { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .gate, .layout { position: relative; z-index: 1; }

    .theme-toggle {
      position: fixed; z-index: 5; top: 16px; right: 16px;
      width: 42px; height: 42px; border-radius: 999px;
      display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--line-strong); color: var(--soft);
      box-shadow: var(--shadow); transition: color .2s, background .2s;
    }
    @media (max-width: 859px) { .theme-toggle { position: absolute; } }
    @media (min-width: 860px) { .theme-toggle { top: 48px; right: 24px; } }
    .theme-toggle:hover { color: var(--text); background: var(--card-hover); }
    .theme-toggle svg { width: 19px; height: 19px; }
    .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .moon { display: none; }
    .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1.title { font: 500 clamp(36px, 5vw, 52px)/1 "Cormorant Garamond", Georgia, serif; }
    .search { max-width: 260px; min-width: 0; }
    @media (max-width: 600px) {
      .search { max-width: none; }
      .head { gap: 12px; }
      h1.title { font-size: 34px; }
      .toolbar { justify-content: flex-start; }
      .cat-tools .btn { padding: 8px 12px; font-size: 13px; }
      .item { padding: 14px; gap: 12px; }
      input, select, textarea { font-size: 16px; } /* iOS nem nagyít rá */
      dialog form { padding: 20px; }
    }
    .cat-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

    .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .list > * { min-width: 0; }
    .txt b { overflow: hidden; text-overflow: ellipsis; }
    .item { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transition: background .2s, transform .2s; }
    a.item:hover { background: var(--card-hover); transform: translateY(-1px); }
    .ico { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: #fff; border: 1px solid var(--line); color: #141414; font-weight: 700; font-size: 16px; }
    .ico img { width: 26px; height: 26px; object-fit: contain; }
    .txt { min-width: 0; flex: 1; }
    .txt b { display: block; font-weight: 600; font-size: 15px; }
    .txt span { display: block; font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .txt small { display: block; font-size: 12px; color: var(--muted); }
    .arrow { width: 18px; height: 18px; flex: none; color: var(--muted); transition: color .2s, transform .2s; }
    a.item:hover .arrow { color: var(--accent-strong); transform: translate(2px, -2px); }
    .acts { display: flex; gap: 4px; flex: none; }
    .acts button { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--soft); }
    .acts button:hover { background: var(--tint); color: var(--text); }
    .acts button.del:hover { color: var(--danger); }
    .acts svg { width: 16px; height: 16px; }
    /* Húzás szerkesztő módban: kártya → másik kártya (sorrend) vagy → menü kategória (áthelyezés) */
    .item[draggable="true"] { cursor: grab; }
    .item.dragging { opacity: .4; }
    .item.drop-before { box-shadow: 0 -3px 0 var(--accent-strong), var(--shadow); }
    .item.drop-after { box-shadow: 0 3px 0 var(--accent-strong), var(--shadow); }
    nav a.drop-target { background: rgba(143, 179, 232, .3); color: var(--text); outline: 2px dashed var(--accent-strong); outline-offset: -2px; }
    @media (max-width: 520px) {
      .acts { gap: 0; }
      .acts button { width: 30px; height: 34px; }
      .acts svg { width: 15px; height: 15px; }
      .toolbar { gap: 6px; }
      .toolbar .btn { padding: 8px 11px; font-size: 13px; }
    }
    .empty { padding: 40px 0; color: var(--muted); text-align: center; }

    /* Dialog */
    dialog { margin: auto; width: calc(100% - 32px); max-width: 460px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 0; box-shadow: var(--shadow-big); }
    dialog::backdrop { background: var(--backdrop); }
    dialog form { display: grid; gap: 12px; padding: 24px; }
    dialog h2 { font: 500 28px/1.1 "Cormorant Garamond", Georgia, serif; margin-bottom: 4px; }
    dialog label { display: grid; gap: 6px; font-size: 13px; color: var(--soft); }
    .row { display: flex; gap: 8px; }
    .row > input { flex: 1; min-width: 0; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .icon-title { font-size: 13px; color: var(--soft); margin-bottom: 6px; }
    .icon-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .icon-pick label { display: block; position: relative; }
    .icon-pick input { position: absolute; opacity: 0; width: 1px; }
    .icon-pick span { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--soft); cursor: pointer; }
    .icon-pick input:checked + span { border-color: var(--accent-strong); color: var(--accent-strong); background: rgba(143, 179, 232, .15); }
    .icon-pick svg { width: 18px; height: 18px; }

    .toast { position: fixed; z-index: 10; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
    .toast.bad { background: var(--danger); color: #fff; }
  </style>
  <link rel="canonical" href="https://szikszaizsu.com/tervezo/">
</head>
<body>
  <canvas class="dots" aria-hidden="true"></canvas>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Sötét téma">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <!-- Belépés -->
  <div class="gate" id="gate" hidden>
    <form id="login-form">
      <h1>Tervező</h1>
      <p>Add meg a jelszavad.</p>
      <label class="sr" for="pw">Jelszó</label>
      <input id="pw" type="password" placeholder="Jelszó" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
      <button class="btn btn-primary" type="submit">Belépés</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </div>

  <!-- Linkek -->
  <div class="layout" id="app" hidden>
    <aside>
      <div class="profile">
        <img src="/assets/portrait-headshot.webp" alt="">
        <div><b>Szikszai Zsu</b><span>Tervező</span></div>
      </div>
      <p class="label" id="nav-label">Források</p>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav"></button>
      <nav><ul id="nav"></ul></nav>
      <button class="btn btn-ghost add-cat edit-only" id="add-cat" type="button" hidden>+ Új kategória</button>
      <div class="side-foot"><a class="btn btn-ghost" href="/">szikszaizsu.com</a></div>
    </aside>

    <main>
      <div class="inner">
        <div class="toolbar">
          <button class="btn btn-primary edit-only" id="add-link" type="button" hidden>+ Új link</button>
          <button class="btn btn-ghost edit-only" id="import" type="button" hidden>Importálás</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
          <button class="btn btn-ghost" id="toggle-edit" type="button">Szerkesztés</button>
          <button class="btn btn-ghost" id="logout" type="button">Kilépés</button>
        </div>
        <div class="head">
          <h1 class="title" id="title"></h1>
          <input class="search" id="search" type="search" placeholder="Keresés…" aria-label="Keresés a linkek között">
        </div>
        <div class="cat-tools" id="cat-tools" hidden>
          <button class="btn btn-ghost" id="cat-edit" type="button">Átnevezés / ikon</button>
          <button class="btn btn-ghost" id="cat-up" type="button">↑ Feljebb</button>
          <button class="btn btn-ghost" id="cat-down" type="button">↓ Lejjebb</button>
          <button class="btn btn-danger" id="cat-del" type="button">Kategória törlése</button>
        </div>
        <div class="list" id="list"></div>
      </div>
    </main>
  </div>

  <!-- Link szerkesztése -->
  <dialog id="link-dlg">
    <form method="dialog" id="link-form">
      <h2 id="link-dlg-title">Új link</h2>
      <label>Link (URL)
        <div class="row">
          <input id="f-url" type="text" inputmode="url" placeholder="https://…" required>
          <button class="btn btn-ghost" id="f-fill" type="button">Kitöltés</button>
        </div>
      </label>
      <label>Név <input id="f-name" type="text" maxlength="80" required></label>
      <label>Rövid leírás <input id="f-desc" type="text" maxlength="160"></label>
      <label>Kategória <select id="f-cat"></select></label>
      <p class="error" id="link-error" role="alert"></p>
      <div class="dlg-actions">
        <button class="btn btn-ghost" value="cancel" formnovalidate type="submit">Mégse</button>
        <button class="btn btn-primary" value="save" type="submit">Mentés</button>
      </div>
    </form>
  </dialog>

  <!-- Kategória szerkesztése -->
  <dialog id="cat-dlg">
    <form method="dialog" id="cat-form">
      <h2 id="cat-dlg-title">Új kategória</h2>
      <label>Név <input id="c-name" type="text" maxlength="60" required></label>
      <label>Csoport <input id="c-group" type="text" maxlength="40" list="c-groups" placeholder="pl. Ötletek"></label>
      <datalist id="c-groups"></datalist>
      <div><p class="icon-title">Ikon</p><div class="icon-pick" id="c-icons"></div></div>
      <div class="dlg-actions">
        <button class="btn btn-ghost" value="cancel" formnovalidate type="submit">Mégse</button>
        <button class="btn btn-primary" value="save" type="submit">Mentés</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="/tervezo/icons.js"></script>
  <script>
    const ICONS = window.TERVEZO_ICONS;
    const API = "/tervezo/api/";
    const KEY = "tervezo-jelszo";
    const $ = (id) => document.getElementById(id);
    const svg = (p, cls = "") => `<svg${cls ? ` class="${cls}"` : ""} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const iconSvg = (name) => svg((ICONS[name] || ICONS.link).path);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const slug = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "kategoria";
    const ACT = {
      edit: '<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
      up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
      down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
      del: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
    };

    let data = { categories: [] };
    let editing = false;
    let editRef = null; // { cat, index } of the link being edited; null for a new link
    let catEditId = null;

    function storedPw() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } }
    function storePw(pw) { try { pw ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch {} }

    async function api(route, options = {}) {
      const res = await fetch(API + route, {
        ...options,
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + storedPw() },
        cache: "no-store"
      });
      if (res.status === 401) { storePw(""); showGate("Hibás jelszó."); throw new Error("401"); }
      if (!res.ok) {
        let msg = "Hiba történt (" + res.status + ").";
        try { msg = (await res.json()).error || msg; } catch {}
        throw new Error(msg);
      }
      return res.status === 204 ? null : res.json();
    }

    function toast(msg, bad = false) {
      const t = $("toast");
      t.textContent = msg; t.classList.toggle("bad", bad); t.hidden = false;
      clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
    }

    // ---------- Belépés ----------
    function showGate(error = "") {
      document.querySelectorAll("dialog[open]").forEach((d) => d.close());
      $("app").hidden = true; $("gate").hidden = false;
      $("login-error").textContent = error;
      $("pw").value = ""; $("pw").focus();
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      storePw($("pw").value);
      $("login-error").textContent = "";
      try { await openApp(); } catch (err) { if (err.message !== "401") $("login-error").textContent = err.message; }
    });

    async function openApp() {
      data = await api("links");
      $("gate").hidden = true; $("app").hidden = false;
      renderAll();
    }

    $("logout").addEventListener("click", () => { storePw(""); setEditing(false); showGate(); });

    // ---------- Megjelenítés ----------
    function current() {
      const id = location.hash.slice(1);
      return data.categories.find((c) => c.id === id) || data.categories[0];
    }

    // A kategóriák "group" mezője szerint csoportcímeket tesz a menübe.
    function renderNav() {
      let group = null;
      $("nav").innerHTML = data.categories.map((c) => {
        const head = c.group && c.group !== group ? `<li class="group">${esc(c.group)}</li>` : "";
        group = c.group || group;
        return `${head}<li><a href="#${esc(c.id)}" data-id="${esc(c.id)}">${iconSvg(c.icon)}<span class="nm">${esc(c.name)}</span><span class="count">${c.links.length}</span></a></li>`;
      }).join("");
      $("nav-label").hidden = data.categories.some((c) => c.group);
      renderNavToggle();
      $("c-groups").innerHTML = [...new Set(data.categories.map((c) => c.group).filter(Boolean))].map((g) => `<option value="${esc(g)}">`).join("");
    }

    function render() {
      const cat = current();
      const q = $("search").value.trim().toLowerCase();
      const rows = q
        ? data.categories.flatMap((c) => c.links.map((l, i) => ({ l, c, i })))
            .filter(({ l }) => (l.name + " " + l.desc + " " + l.url).toLowerCase().includes(q))
        : cat ? cat.links.map((l, i) => ({ l, c: cat, i })) : [];

      $("title").textContent = q ? "Keresés" : cat ? cat.name : "Tervező";
      document.title = $("title").textContent + " · Tervező";
      $("nav").querySelectorAll("a").forEach((a) => {
        if (!q && cat && a.dataset.id === cat.id) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });
      $("cat-tools").hidden = !editing || !!q || !cat;

      if (!rows.length) {
        $("list").innerHTML = `<p class="empty">${q ? "Nincs találat." : editing ? "Még nincs link ebben a kategóriában. Adj hozzá egyet az „+ Új link” gombbal." : "Ebben a kategóriában még nincs link."}</p>`;
        return;
      }
      $("list").innerHTML = rows.map(({ l, c, i }) => {
        let host = "";
        try { host = new URL(l.url).hostname; } catch {}
        const ico = `<span class="ico" data-letter="${esc((l.name || "?")[0])}"><img src="https://www.google.com/s2/favicons?domain=${esc(host)}&sz=64" alt="" loading="lazy"></span>`;
        const txt = `<span class="txt"><b>${esc(l.name)}</b><span>${esc(l.desc || host)}</span>${q ? `<small>${esc(c.name)}</small>` : ""}</span>`;
        if (!editing) {
          return `<a class="item" href="${esc(l.url)}" target="_blank" rel="noopener">${ico}${txt}${svg('<path d="M7 17L17 7M8 7h9v9"/>', "arrow")}</a>`;
        }
        const ref = `data-cat="${esc(c.id)}" data-i="${i}"`;
        return `<div class="item"${q ? "" : ` draggable="true" ${ref}`}>${ico}${txt}<span class="acts">
          <button type="button" ${ref} data-act="edit" aria-label="Szerkesztés">${svg(ACT.edit)}</button>
          <button type="button" ${ref} data-act="up" aria-label="Feljebb">${svg(ACT.up)}</button>
          <button type="button" ${ref} data-act="down" aria-label="Lejjebb">${svg(ACT.down)}</button>
          <button type="button" class="del" ${ref} data-act="del" aria-label="Törlés">${svg(ACT.del)}</button>
        </span></div>`;
      }).join("");
      $("list").querySelectorAll(".ico img").forEach((img) => {
        img.addEventListener("error", () => { img.parentElement.textContent = img.parentElement.dataset.letter; });
      });
    }

    function renderNavToggle() {
      const cat = current();
      $("nav-toggle").innerHTML = cat
        ? `${iconSvg(cat.icon)}<span class="nm">${esc(cat.name)}</span>${svg('<path d="M6 9l6 6 6-6"/>', "chev")}`
        : "Kategóriák";
    }
    function setNavOpen(open) {
      document.querySelector("aside").classList.toggle("nav-open", open);
      $("nav-toggle").setAttribute("aria-expanded", open);
    }
    $("nav-toggle").addEventListener("click", () => setNavOpen(!document.querySelector("aside").classList.contains("nav-open")));
    $("nav").addEventListener("click", (e) => { if (e.target.closest("a")) setNavOpen(false); });

    function renderAll() { renderNav(); render(); }

    window.addEventListener("hashchange", () => { $("search").value = ""; render(); renderNavToggle(); });
    $("search").addEventListener("input", render);

    // ---------- Szerkesztés ----------
    function setEditing(on) {
      editing = on;
      $("toggle-edit").textContent = on ? "Kész" : "Szerkesztés";
      document.querySelectorAll(".edit-only").forEach((el) => { el.hidden = !on; });
      render();
    }
    $("toggle-edit").addEventListener("click", () => setEditing(!editing));

    async function save(message) {
      const backup = JSON.stringify(data);
      try {
        data = await api("links", { method: "PUT", body: JSON.stringify(data) });
        renderAll();
        toast(message || "Elmentve");
        return true;
      } catch (err) {
        data = JSON.parse(backup);
        if (err.message !== "401") toast(err.message, true);
        return false;
      }
    }

    const findCat = (id) => data.categories.find((c) => c.id === id);

    // ---------- Húzás (drag & drop) ----------
    let drag = null; // { cat, i }
    const clearDropMarks = () => document.querySelectorAll(".drop-before, .drop-after, .drop-target").forEach((el) => el.classList.remove("drop-before", "drop-after", "drop-target"));

    $("list").addEventListener("dragstart", (e) => {
      const item = e.target.closest(".item[draggable]");
      if (!item) return;
      drag = { cat: item.dataset.cat, i: Number(item.dataset.i) };
      item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
    });
    $("list").addEventListener("dragend", () => { drag = null; clearDropMarks(); document.querySelectorAll(".dragging").forEach((el) => el.classList.remove("dragging")); });

    $("list").addEventListener("dragover", (e) => {
      const item = e.target.closest(".item[draggable]");
      if (!drag || !item || item.dataset.cat !== drag.cat) return;
      e.preventDefault();
      clearDropMarks();
      const after = e.clientY > item.getBoundingClientRect().top + item.offsetHeight / 2;
      item.classList.add(after ? "drop-after" : "drop-before");
    });
    $("list").addEventListener("drop", (e) => {
      const item = e.target.closest(".item[draggable]");
      if (!drag || !item || item.dataset.cat !== drag.cat) return;
      e.preventDefault();
      const cat = findCat(drag.cat);
      const from = drag.i;
      let to = Number(item.dataset.i) + (item.classList.contains("drop-after") ? 1 : 0);
      clearDropMarks();
      if (to > from) to--;
      if (to === from) return;
      const [link] = cat.links.splice(from, 1);
      cat.links.splice(to, 0, link);
      save("Sorrend elmentve");
    });

    $("nav").addEventListener("dragover", (e) => {
      const a = e.target.closest("a[data-id]");
      if (!drag || !a) return;
      e.preventDefault();
      clearDropMarks();
      if (a.dataset.id !== drag.cat) a.classList.add("drop-target");
    });
    $("nav").addEventListener("dragleave", (e) => { const a = e.target.closest("a[data-id]"); if (a && !a.contains(e.relatedTarget)) a.classList.remove("drop-target"); });
    $("nav").addEventListener("drop", async (e) => {
      const a = e.target.closest("a[data-id]");
      if (!drag || !a) return;
      e.preventDefault();
      clearDropMarks();
      const from = findCat(drag.cat), to = findCat(a.dataset.id);
      if (!to || from === to) return;
      const snapshot = JSON.stringify(data);
      to.links.push(...from.links.splice(drag.i, 1));
      if (!(await save(`Áthelyezve ide: ${to.name}`))) { data = JSON.parse(snapshot); renderAll(); }
    });

    $("list").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const cat = findCat(b.dataset.cat);
      const i = Number(b.dataset.i);
      if (b.dataset.act === "edit") return openLinkDialog(cat, i);
      if (b.dataset.act === "del") {
        if (!confirm(`Törlöd ezt a linket: ${cat.links[i].name}?`)) return;
        const removed = cat.links.splice(i, 1);
        if (!(await save("Törölve"))) cat.links.splice(i, 0, ...removed);
        return;
      }
      const j = b.dataset.act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= cat.links.length) return;
      [cat.links[i], cat.links[j]] = [cat.links[j], cat.links[i]];
      save("Sorrend elmentve");
    });

    function fillCatSelect(selected) {
      $("f-cat").innerHTML = data.categories.map((c) => `<option value="${esc(c.id)}"${c.id === selected ? " selected" : ""}>${esc(c.name)}</option>`).join("");
    }

    function openLinkDialog(cat, index) {
      editRef = cat ? { cat: cat.id, index } : null;
      const link = editRef ? cat.links[index] : { url: "", name: "", desc: "" };
      $("link-dlg-title").textContent = editRef ? "Link szerkesztése" : "Új link";
      $("f-url").value = link.url; $("f-name").value = link.name; $("f-desc").value = link.desc;
      fillCatSelect(editRef ? cat.id : (current() || {}).id);
      $("link-error").textContent = "";
      $("link-dlg").showModal();
      (editRef ? $("f-name") : $("f-url")).focus();
    }
    $("add-link").addEventListener("click", () => {
      if (!data.categories.length) return toast("Előbb hozz létre egy kategóriát.", true);
      openLinkDialog(null, null);
    });

    function normalUrl(raw) {
      const url = raw.trim();
      return /^https?:\/\//i.test(url) ? url : "https://" + url;
    }

    // "www.unsplash.com" -> "Unsplash"
    function siteName(url) {
      try {
        const parts = new URL(url).hostname.replace(/^www\./, "").split(".");
        const base = parts.length > 1 ? parts[parts.length - 2] : parts[0];
        return base.charAt(0).toUpperCase() + base.slice(1);
      } catch { return ""; }
    }

    async function fillFromUrl() {
      if (!$("f-url").value.trim()) return;
      const url = normalUrl($("f-url").value);
      $("f-url").value = url;
      const btn = $("f-fill");
      btn.disabled = true; btn.textContent = "…";
      $("link-error").textContent = "";
      try {
        const meta = await api("meta", { method: "POST", body: JSON.stringify({ url }) });
        if (!$("f-name").value) $("f-name").value = meta.title || siteName(url);
        if (meta.desc && !$("f-desc").value) $("f-desc").value = meta.desc;
        if (!meta.title && !meta.desc) $("link-error").textContent = "Ez az oldal nem engedi kiolvasni magát, a leírást írd be kézzel.";
      } catch {}
      btn.disabled = false; btn.textContent = "Kitöltés";
    }
    $("f-fill").addEventListener("click", fillFromUrl);
    $("f-url").addEventListener("change", () => { if (!$("f-name").value) fillFromUrl(); });

    $("link-form").addEventListener("submit", async (e) => {
      if (e.submitter && e.submitter.value === "cancel") return;
      e.preventDefault();
      const url = normalUrl($("f-url").value);
      try { new URL(url); } catch { $("link-error").textContent = "Ez nem érvényes link."; return; }
      const link = { url, name: $("f-name").value.trim(), desc: $("f-desc").value.trim() };
      const before = JSON.stringify(data);
      const target = findCat($("f-cat").value);
      if (editRef) {
        const from = findCat(editRef.cat);
        if (from === target) from.links[editRef.index] = link;
        else { from.links.splice(editRef.index, 1); target.links.push(link); }
      } else {
        target.links.push(link);
      }
      if (await save(editRef ? "Link elmentve" : "Link hozzáadva")) {
        $("link-dlg").close();
        if (location.hash.slice(1) !== target.id) location.hash = target.id;
      } else {
        data = JSON.parse(before);
      }
    });

    // Kategóriák
    $("c-icons").innerHTML = Object.entries(ICONS).map(([k, v]) =>
      `<label title="${esc(v.label)}"><input type="radio" name="c-icon" value="${k}"><span>${svg(v.path)}</span></label>`
    ).join("");

    function openCatDialog(cat) {
      catEditId = cat ? cat.id : null;
      $("cat-dlg-title").textContent = cat ? "Kategória szerkesztése" : "Új kategória";
      $("c-name").value = cat ? cat.name : "";
      $("c-group").value = cat ? (cat.group || "") : ((current() || {}).group || "");
      const icon = cat ? cat.icon : "link";
      document.querySelectorAll('input[name="c-icon"]').forEach((r) => { r.checked = r.value === icon; });
      $("cat-dlg").showModal();
      $("c-name").focus();
    }
    $("add-cat").addEventListener("click", () => openCatDialog(null));
    $("cat-edit").addEventListener("click", () => openCatDialog(current()));

    $("cat-form").addEventListener("submit", async (e) => {
      if (e.submitter && e.submitter.value === "cancel") return;
      e.preventDefault();
      const name = $("c-name").value.trim();
      if (!name) return;
      const icon = (document.querySelector('input[name="c-icon"]:checked') || {}).value || "link";
      const group = $("c-group").value.trim();
      let id;
      if (catEditId) {
        const cat = findCat(catEditId);
        cat.name = name; cat.icon = icon; id = cat.id;
        if (group) cat.group = group; else delete cat.group;
      } else {
        id = slug(name);
        while (findCat(id)) id += "-2";
        const cat = { id, name, icon, links: [] };
        if (group) cat.group = group;
        // Új kategória a csoportja végére kerül, hogy a menüben együtt maradjon.
        const lastInGroup = group ? data.categories.map((c) => c.group).lastIndexOf(group) : -1;
        data.categories.splice(lastInGroup >= 0 ? lastInGroup + 1 : data.categories.length, 0, cat);
      }
      if (await save("Kategória elmentve")) {
        $("cat-dlg").close();
        location.hash = id;
      }
    });

    function moveCat(step) {
      const cat = current();
      const i = data.categories.indexOf(cat);
      const j = i + step;
      if (j < 0 || j >= data.categories.length) return;
      [data.categories[i], data.categories[j]] = [data.categories[j], data.categories[i]];
      save("Sorrend elmentve");
    }
    $("cat-up").addEventListener("click", () => moveCat(-1));
    $("cat-down").addEventListener("click", () => moveCat(1));

    $("cat-del").addEventListener("click", async () => {
      const cat = current();
      const n = cat.links.length;
      if (!confirm(n ? `A(z) „${cat.name}” kategóriában ${n} link van, ezek is törlődnek. Biztos?` : `Törlöd a(z) „${cat.name}” kategóriát?`)) return;
      data.categories.splice(data.categories.indexOf(cat), 1);
      if (await save("Kategória törölve")) location.hash = data.categories[0] ? data.categories[0].id : "";
    });

    // ---------- Importálás (JSON: { categories: [{ id, name, icon, links: [{ name, desc, url }] }] }) ----------
    $("import").addEventListener("click", () => $("import-file").click());
    $("import-file").addEventListener("change", async () => {
      const file = $("import-file").files[0];
      $("import-file").value = "";
      if (!file) return;
      let doc, incoming;
      try { doc = JSON.parse(await file.text()); incoming = doc.categories; if (!Array.isArray(incoming)) throw new Error(); }
      catch { return toast("Ez nem Tervező import fájl.", true); }
      if (doc.mode === "reorganize" || doc.mode === "replace") return reorganize(doc);
      const before = JSON.stringify(data);
      let added = 0;
      for (const cat of incoming) {
        if (!cat || !cat.name || !Array.isArray(cat.links)) continue;
        let target = data.categories.find((c) => c.id === cat.id || c.name.toLowerCase() === String(cat.name).toLowerCase());
        if (!target) {
          let id = slug(cat.id || cat.name);
          while (findCat(id)) id += "-2";
          target = { id, name: String(cat.name), icon: ICONS[cat.icon] ? cat.icon : "link", ...(cat.group && { group: String(cat.group) }), links: [] };
          data.categories.push(target);
        }
        // Csak a célkategórián belül szűr: ugyanaz a link több kategóriában is lehet.
        const known = new Set(target.links.map((l) => l.url.replace(/\/$/, "")));
        for (const l of cat.links) {
          const key = String(l.url || "").replace(/\/$/, "");
          if (!key || known.has(key)) continue;
          known.add(key);
          target.links.push({ name: l.name || siteName(l.url), desc: l.desc || "", url: l.url });
          added++;
        }
      }
      if (!added) { data = JSON.parse(before); return toast("Nincs új link a fájlban."); }
      if (!(await save(`${added} új link importálva`))) data = JSON.parse(before);
    });

    // Biztonsági mentés letöltése; visszatöltve (Importálás) pontosan ezt az állapotot állítja vissza.
    function downloadBackup() {
      const stamp = new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-");
      const blob = new Blob([JSON.stringify({ mode: "replace", ...data }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `tervezo-mentes-${stamp}.json`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    const urlKey = (u) => { try { return new URL(u).href.replace(/\/$/, ""); } catch { return String(u).replace(/\/$/, ""); } };

    // "replace": a fájl tartalma lesz az új állapot.
    // "reorganize": a fájl kategóriái és sorrendje lesz az új rend; a jelenlegi linkek közül
    // amit a fájl nem ismer, az "Egyéb" kategóriába kerül, így semmi nem vész el.
    async function reorganize(doc) {
      const replace = doc.mode === "replace";
      const msg = replace
        ? "Visszaállítod a Tervezőt ebből a mentésből? A jelenlegi állapotról előbb letöltök egy mentést."
        : "Átrendezed a linkjeidet az új kategóriákba? Előbb letöltök egy mentést a mostani állapotról.";
      if (!confirm(msg)) return;
      downloadBackup();
      const before = JSON.stringify(data);
      const cats = doc.categories.filter((c) => c && c.name && Array.isArray(c.links)).map((c) => ({
        id: slug(c.id || c.name), name: String(c.name), icon: ICONS[c.icon] ? c.icon : "link", ...(c.group && { group: String(c.group) }),
        links: c.links.filter((l) => l && l.url).map((l) => ({ name: l.name || siteName(l.url), desc: l.desc || "", url: l.url }))
      }));
      if (!replace) {
        const placed = new Set(cats.flatMap((c) => c.links.map((l) => urlKey(l.url))));
        const extra = [];
        for (const c of data.categories) for (const l of c.links) {
          const k = urlKey(l.url);
          if (!placed.has(k)) { placed.add(k); extra.push(l); }
        }
        if (extra.length) {
          let other = cats.find((c) => c.id === "egyeb");
          if (!other) cats.push(other = { id: "egyeb", name: "Egyéb", icon: "link", group: "Egyéb", links: [] });
          other.links.push(...extra);
        }
      }
      data = { categories: cats };
      if (await save(replace ? "Visszaállítva" : "Átrendezve")) location.hash = cats[0] ? cats[0].id : "";
      else data = JSON.parse(before);
    }

    // ---------- Téma ----------
    function syncThemeLabel() {
      const dark = document.documentElement.dataset.theme === "dark";
      $("theme-toggle").setAttribute("aria-label", dark ? "Világos téma" : "Sötét téma");
      $("theme-toggle").title = dark ? "Világos téma" : "Sötét téma";
    }
    $("theme-toggle").addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      if (dark) document.documentElement.dataset.theme = "dark";
      else delete document.documentElement.dataset.theme;
      try { localStorage.setItem("tervezo-tema", dark ? "dark" : "light"); } catch {}
      syncThemeLabel();
    });
    syncThemeLabel();

    // ---------- Pontrács ----------
    (() => {
      const cv = document.querySelector(".dots"), ctx = cv.getContext("2d");
      const GAP = 22, RADIUS = 150, PUSH = 7;
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let dpr, w, h, cols, rows, ox, oy, energy, base = "#c9cdd4", dark = false;
      let mx = -1e4, my = -1e4, raf = 0, last = 0;

      function readTheme() {
        dark = document.documentElement.dataset.theme === "dark";
        base = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || base;
      }
      function size() {
        dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
        cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.ceil(w / GAP) + 1; rows = Math.ceil(h / GAP) + 1;
        ox = (w - (cols - 1) * GAP) / 2; oy = (h - (rows - 1) * GAP) / 2;
        energy = new Float32Array(cols * rows);
        draw(0, 0);
      }
      // Minden pontnak "energiája" van: az egér közelében 1, utána kb. 1 mp alatt cseng le, így csík marad utána.
      function draw(dt, t) {
        ctx.clearRect(0, 0, w, h);
        const decay = Math.pow(0.04, dt / 1000);
        let busy = false;
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
          const k = j * cols + i, x = ox + i * GAP, y = oy + j * GAP;
          const dx = x - mx, dy = y - my, d = Math.hypot(dx, dy);
          let near = d < RADIUS ? 1 - d / RADIUS : 0;
          near = near * near * (3 - 2 * near);
          const e = energy[k] = Math.max(near, energy[k] * decay);
          let px = x, py = y;
          if (near > 0 && d > .01) { px += dx / d * PUSH * near; py += dy / d * PUSH * near; }
          if (e < .01) {
            ctx.globalAlpha = 1; ctx.fillStyle = base;
            ctx.fillRect(px - .9, py - .9, 1.8, 1.8);
            continue;
          }
          busy = true;
          const r = .9 + 1.4 * e;
          const hue = (x * 1.1 + y * .7 + t * .08) % 360;
          ctx.globalAlpha = .25 + .75 * e;
          ctx.fillStyle = `hsl(${hue} ${dark ? 85 : 80}% ${dark ? 68 : 58}%)`;
          ctx.fillRect(px - r, py - r, r * 2, r * 2);
        }
        ctx.globalAlpha = 1;
        return busy;
      }
      function loop(t) {
        const dt = last ? Math.min(t - last, 50) : 16; last = t;
        raf = draw(dt, t) ? requestAnimationFrame(loop) : 0; // nyugalomban nem rajzol
        if (!raf) last = 0;
      }
      function kick() { if (!raf && !still && !document.hidden) raf = requestAnimationFrame(loop); }
      addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
      addEventListener("pointerdown", (e) => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
      document.documentElement.addEventListener("mouseleave", () => { mx = my = -1e4; kick(); });
      addEventListener("blur", () => { mx = my = -1e4; kick(); });
      addEventListener("resize", size);
      new MutationObserver(() => { readTheme(); draw(0, performance.now()); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      readTheme(); size();
    })();

    // ---------- Indítás ----------
    if (storedPw()) openApp().catch((err) => { if (err.message !== "401") showGate(err.message); });
    else showGate();
  </script>
</body>
</html>
