<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Havi pénzügyek</title>
<link rel="manifest" href="/payouts/manifest.json">
<meta name="theme-color" content="#14171d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pénzügyek">
<link rel="apple-touch-icon" href="/payouts/icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='46' font-size='44' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='%232ecc71'%3E%24%3C/text%3E%3C/svg%3E">
<style>
:root{--dot:#c9cdd4;--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e3e6ec;--green:#2e9e5b;--red:#d4534b;--blue:#3b6fd8;--chip:#eef1f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dot:rgba(255,255,255,.13);--bg:#14171d;--card:#1d222b;--ink:#e8ebf1;--mut:#9aa3b5;--line:#2c3340;--green:#4cc27a;--red:#ef7a72;--blue:#7ea6f5;--chip:#262c37}}
:root[data-theme="dark"]{--dot:rgba(255,255,255,.13);--bg:#14171d;--card:#1d222b;--ink:#e8ebf1;--mut:#9aa3b5;--line:#2c3340;--green:#4cc27a;--red:#ef7a72;--blue:#7ea6f5;--chip:#262c37}
*{box-sizing:border-box}
html{background:var(--bg)}
.dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
body{margin:0;background:transparent;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
h1{font-size:20px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
button.danger{color:var(--red)}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:110px;text-align:right}
.note{color:var(--mut);font-size:13px;margin:6px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .l{font-size:12px;color:var(--mut)}
.card .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start;margin-bottom:12px}
.grid .panel{margin-bottom:0}
.handle{cursor:grab;color:var(--mut);padding:0 6px 0 0;user-select:none;font-size:16px;line-height:1}
.handle:active{cursor:grabbing}
.panel.dragging{opacity:.45}
.panel.drop-target{outline:2px dashed var(--blue);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm{flex:1;min-width:0;width:auto}
.sub{display:flex;justify-content:space-between;font-weight:600;padding:8px 0 2px;color:var(--mut);font-variant-numeric:tabular-nums}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 2px}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.add input[type=text]{flex:1;min-width:160px}
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:960px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-align:right;font-weight:600}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:210px;z-index:1}
td input{width:86px;padding:3px 4px;text-align:right}
tr.tot td{font-weight:700;background:var(--chip)}
tr.gh td{font-size:12px;text-transform:uppercase;color:var(--mut);padding-top:12px;background:var(--card)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.muted{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<canvas class="dots" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>Havi pénzügyek</h1>
    <div class="bar">
      <select id="year" aria-label="Év">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
      <button data-act="mode" data-v="ho">Havi nézet</button>
      <button data-act="mode" data-v="tabla">Éves tábla</button>
      <button data-act="csv">CSV</button>
      <button data-act="exp">Mentés (JSON)</button>
      <button data-act="imp">Betöltés</button>
      <input type="file" id="file" accept="application/json" hidden>
      <button class="danger" data-act="reset">Eredeti adatok</button>
    </div>
  </header>
  <div class="note">Az adatok ebben a böngészőben tárolódnak. Biztonsági mentéshez használd a JSON mentést.</div>
  <div id="app"></div>
</div>

<script>
const MON=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const MS=['Jan','Feb','Már','Ápr','Máj','Jún','Júl','Aug','Szep','Okt','Nov','Dec'];
const PANEL_KEYS=['bevetel','laci','hitel','rezsi','gerda','zente','egyeb','info'];
const GROUPS=[['bevetel','Bevétel'],['laci','Laci'],['hitel','Hitel'],['rezsi','Rezsi'],['gerda','Gerda kiadás'],['zente','Zente kiadás'],['egyeb','Egyéb kiadás'],['info','Követés (nem számít bele)']];
const EXP=['hitel','rezsi','gerda','zente','egyeb'];
const INC=['bevetel','laci'];
const GLABEL=Object.fromEntries(GROUPS);

// Hónap-tömb: index 0 = január. Csak azokat a hónapokat töltjük, ahol a sheetben van szám.
const V=o=>{const a=Array(12).fill(null);for(const k in o)a[+k]=o[k];return a;};
const A=(...a)=>a;
const it=(id,name,group,vals)=>({id,name,group,vals});

const SEED={
  2026:{items:[
    it('fizetes','Fizetés','bevetel',V({4:5000,5:5000,6:8000,7:8000,8:8000,9:8000})),
    it('kajabon','KAJABON','bevetel',V({0:800,1:800,2:800,3:800})),
    it('fizetes7','Fizetés 7','bevetel',V({0:950,1:950,2:950,3:660})),
    it('fizetes22','Fizetés 22','bevetel',V({0:1750,1:1750,2:1750})),
    it('zoltan','Zoltán','bevetel',V({1:200})),
    it('szepesi','Szepesi','bevetel',V({2:400})),
    it('szabadsag','Szabadság','bevetel',V({3:450})),
    it('laciextra','Laci utalás extra','laci',V({6:2400})),
    it('lacicash','Laci cash','laci',V({5:550})),
    it('lacitart','Laci tartásdíj - utalva','laci',V({0:800,1:800,2:0,3:800,4:800,8:800,9:800})),
    it('osztondij','Ösztöndíj','bevetel',V({0:600,1:600,2:600,3:600,4:600,5:600,6:600,7:600,8:600})),
    it('gyerekpenz','Gyerekpénz (állami)','bevetel',V({0:580,1:580,2:580,3:580,4:580,5:580,6:580,7:580,8:580,9:580})),

    it('reszlet','Részlet (hitel/kölcsön)','hitel',V({0:1100,1:1400,2:1400,3:1400,4:1000,5:2000,6:1400,7:1400,8:1200})),

    it('gaz','Gáz','rezsi',V({0:750,1:100,2:700,3:375,4:400,5:300,6:80,7:100})),
    it('villany','Villany (Electrica)','rezsi',V({3:120,4:750,5:100,6:150,7:70,8:60})),
    it('viz','Víz','rezsi',V({0:150,1:220,2:200,4:600,5:200,6:200,7:200,8:100})),
    it('telefon','Telefon','rezsi',V({0:250,1:250,2:250,3:250,4:250,5:300,6:300,7:300,8:300})),
    it('internet','Internet/TV (RDS)','rezsi',V({0:50,1:50,2:50,3:60,4:50,5:50,6:50,7:50,8:50})),

    it('kirandulas','Kirándulás Gerda','gerda',V({4:800})),
    it('osztalypenz','Osztálypénz','gerda',V({6:500,9:300})),
    it('tanc','Tánc - Gerda','gerda',V({0:140,1:140,2:140,3:140,4:140,5:140,7:0,8:130})),
    it('iskolamaskepp','Iskola másképp','gerda',V({0:130,8:60})),
    it('napsugar','Napsugár p','gerda',V({2:130})),
    it('gerdatabor','Gerda tábor','gerda',V({4:300,5:350})),
    it('suli','Suli - Zente (délután)','zente',V({0:200,1:200,2:200,3:200,4:200,7:0,8:100})),
    it('magocska','Magocska - Zente','zente',V({1:240})),
    it('iskolamaskep','Iskola maskep','zente',V({0:55,8:60})),
    it('osztalypenzz','Osztálypénz - Zente','zente',V({5:520,6:320,9:200})),
    it('lira','LIRA','zente',V({2:100})),

    it('mosogep','Mosógép','egyeb',V({5:300})),
    it('centrala','CENTRALA VERIF','egyeb',V({4:200})),
    it('utado','UTADO','egyeb',V({4:50})),
    it('fogaszat','Fogászat','egyeb',V({6:50,7:250,8:2700})),
    it('hazado','Hazado','egyeb',V({9:1000})),
    it('benzin','Benzin','egyeb',V({0:400,1:500,2:550,3:300,4:600,5:300,6:200,7:350,8:600})),
    it('elofizetesek','Előfizetések online','egyeb',V({7:500,8:600,9:600})),
    it('macska','Macska','egyeb',V({4:200})),
    it('kave','Kávé','egyeb',V({5:270,8:100})),
    it('autoado','Autó adó','egyeb',V({6:200})),
    it('szervice','Szervíz autó','egyeb',V({7:350})),
    it('biztositas','Biztosítás autó','egyeb',V({9:1000})),
    it('kazan','Kazán','egyeb',V({8:400})),
    it('itp','ITP','egyeb',V({7:250})),

    it('bank','Bank egyenleg','info',V({6:151045,7:135879,8:130879,9:125879,10:120879,11:115879})),
    it('csokentes','Csökkentés (CSOKENTES)','info',V({7:15000,8:0,9:10000,10:5000,11:5000})),
    it('havireszlet','Havi részlet (bank)','info',V({6:1300,7:1211,8:1166,9:1122,10:1078,11:1034}))
  ],laciPay:V({5:550,6:2400,8:1200}),laciOpen:0},
  2027:{laciPay:Array(12).fill(null),laciOpen:0,items:[
    it('fizetes','Fizetés','bevetel',V({0:8000})),
    it('lacitart','Laci tartásdíj - utalva','laci',V({0:800})),
    it('gyerekpenz','Gyerekpénz (állami)','bevetel',V({0:580})),

    it('gaz','Gáz','rezsi',V({0:750})),
    it('viz','Víz','rezsi',V({0:150})),
    it('telefon','Telefon','rezsi',V({0:250})),
    it('internet','Internet/TV (RDS)','rezsi',V({0:50})),

    it('bank','Bank egyenleg','info',A(110879,105879,100879,95879,90879,85879,80879,75879,70879,65879,60879,55879)),
    it('csokentes','Csökkentés (CSOKENTES)','info',A(5000,5000,5000,5000,5000,5000,5000,5000,5000,5000,5000,5000)),
    it('havireszlet','Havi részlet (bank)','info',A(990,946,902,858,814,770,726,682,638,594,550,506))
  ]},
  subs:[{n:'cgdp',e:20},{n:'Midjourney',e:30},{n:'Claude',e:22},{n:'Magnific',e:44},{n:'Figma',e:20}]
};

const KEY='penzugy-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
let st;
try{st=JSON.parse(localStorage.getItem(KEY));}catch(e){st=null;}
if(!st||!st[2026]||!st[2027])st=clone(SEED);
// Régi mentés átállítása: az azonos id-jú tételek a SEED szerinti csoportot kapják, hiányzó Laci-mezők pótlása
function ensureData(){
  if(!st.sheetBankFix){
    const c=st[2026].items.find(x=>x.id==='csokentes');
    if(c)c.vals=clone(SEED[2026].items.find(x=>x.id==='csokentes').vals);
    const b=st[2026].items.find(x=>x.id==='bank');
    if(b)b.vals=clone(SEED[2026].items.find(x=>x.id==='bank').vals);
    st.sheetBankFix=true;
  }
  // Kártyák sorrendje (húzással módosítható), hiányzó kulcsok a végére kerülnek
  const cur=Array.isArray(st.order)?st.order.filter(k=>PANEL_KEYS.includes(k)):[];
  st.order=[...cur,...PANEL_KEYS.filter(k=>!cur.includes(k))];
  for(const y of [2026,2027]){
    // A kézi „Laci – elmaradás” sor helyett a Laci-elszámolás számol
    st[y].items=st[y].items.filter(i=>i.id!=="laciel");
    for(const i of st[y].items){
      const s=SEED[y].items.find(x=>x.id===i.id);
      if(s)i.group=s.group;else if(i.group==='gyerek')i.group='gerda';
    }
    if(!st[y].laciPay)st[y].laciPay=clone(SEED[y].laciPay);
    if(st[y].laciOpen===undefined)st[y].laciOpen=SEED[y].laciOpen;
  }
}
ensureData();

const now=new Date();
let year=2026, mode='ho', m=(now.getFullYear()===2026)?now.getMonth():0;
const app=document.getElementById('app');

const fmt=n=>Math.round(n).toLocaleString('hu-HU')+' lei';
const fmtN=n=>n?Math.round(n).toLocaleString('hu-HU'):'–';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=()=>st[year].items;
const tot=(f,mi)=>{let s=0;for(const i of items()){if(!f(i))continue;s+=(mi===null)?i.vals.reduce((a,b)=>a+(b||0),0):(i.vals[mi]||0);}return s;};
const inc=mi=>tot(i=>INC.includes(i.group),mi);
const exp=mi=>tot(i=>EXP.includes(i.group),mi);
const bal=mi=>inc(mi)-exp(mi);
const gsum=(g,mi)=>tot(i=>i.group===g,mi);
const rowSum=i=>i.vals.reduce((a,b)=>a+(b||0),0);
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

const card=(l,v,signed)=>`<div class="card"><div class="l">${l}</div><div class="v ${signed?(v<0?'neg':'pos'):''}">${fmt(v)}</div></div>`;
const inp=(i,mi)=>`<input type="number" inputmode="decimal" step="any" data-id="${i.id}" data-m="${mi}" value="${i.vals[mi]==null?'':i.vals[mi]}">`;

// Havonkénti név: ha az adott hónapra van felülírás, azt használjuk, különben az alapnevet
const nameOf=(i,mi)=>(i.names&&i.names[mi]!=null)?i.names[mi]:i.name;
function rows(g){
  const list=items().filter(i=>i.group===g);
  if(!list.length)return '<div class="muted">Nincs tétel.</div>';
  return list.map(i=>`<div class="row"><input type="text" class="nm" data-name="${i.id}" data-nm="${m}" value="${esc(nameOf(i,m))}" aria-label="Tétel neve"><span>${inp(i,m)}</span><button class="danger" data-act="del" data-id="${i.id}" data-mo="1" title="Törlés ebből a hónapból">✕</button></div>`).join('');
}

function chart(){
  const W=640,H=220,P=28,base=H-P,max=Math.max(1,...[...Array(12).keys()].map(i=>Math.max(inc(i),exp(i))));
  const bw=(W-P*2)/12;
  let s='';
  for(let i=0;i<12;i++){
    const x=P+i*bw, hI=inc(i)/max*(H-P-18), hE=exp(i)/max*(H-P-18);
    s+=`<rect x="${x+bw*0.14}" y="${base-hI}" width="${bw*0.32}" height="${hI}" fill="var(--green)" rx="2"><title>${MON[i]} bevétel: ${fmt(inc(i))}</title></rect>`;
    s+=`<rect x="${x+bw*0.5}" y="${base-hE}" width="${bw*0.32}" height="${hE}" fill="var(--red)" rx="2"><title>${MON[i]} kiadás: ${fmt(exp(i))}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="${i===m&&mode==='ho'?'var(--ink)':'var(--mut)'}" font-weight="${i===m&&mode==='ho'?700:400}">${MS[i]}</text>`;
  }
  return `<div class="panel"><h2>Havi bevétel × kiadás (${year})</h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Havi bevétel és kiadás">${s}</svg><div class="muted">Zöld: bevétel · Piros: kiadás</div></div>`;
}

function hoView(){
  let h=`<div class="bar" style="margin-bottom:12px"><button data-act="prev" aria-label="Előző hónap">‹</button><select data-role="month" aria-label="Hónap">${MON.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n}</option>`).join('')}</select><button data-act="next" aria-label="Következő hónap">›</button></div>`;
  h+=`<div class="cards">${card('Bevétel – '+MON[m],inc(m))}${card('Kiadás – '+MON[m],exp(m))}${card('Egyenleg – '+MON[m],bal(m),true)}${card('Év egyenleg ('+year+')',bal(null),true)}</div>`;
  h+=chart();
  const block=(title,g,total,note)=>`<div class="panel" data-panel="${g}"><h2><span class="handle" draggable="true" title="Húzd át a sorrendhez">☰</span>${title}${note?` <span class="muted">${note}</span>`:''}</h2>${rows(g)}${total==null?'':`<div class="sub"><span>Összesen</span><span>${fmt(total)}</span></div>`}</div>`;
  const parts={bevetel:block('Bevétel','bevetel',gsum('bevetel',m)).slice(0,-6)+`<div class="sub" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px;color:var(--ink)"><span>Összes bevétel (Laci-val)</span><span>${fmt(inc(m))}</span></div></div>`,laci:block('Laci','laci',gsum('laci',m)),info:block('Követés','info',null,'(nem számít bele)')};
  EXP.forEach(g=>parts[g]=block(GLABEL[g],g,gsum(g,m)));
  h+=`<div class="muted" style="margin:0 0 8px">A kártyákat a ☰ jelnél megfogva át tudod rendezni.</div><div class="grid">${st.order.map(k=>parts[k]).join('')}</div>`;
  h+=`<div class="panel"><h2>Havi részlet csökkenése</h2><div class="row"><span class="n">Csökkenés havonta (októbertől, lei)</span><input type="number" inputmode="decimal" step="any" id="resztLep" value="${resztLep()}" style="width:110px"></div></div>`;
  return h;
}

function tableView(){
  const cells=fn=>{let r='';for(let i=0;i<12;i++)r+=`<td class="num">${fmtN(fn(i))}</td>`;return r+`<td class="num">${fmtN(fn(null))}</td>`;};
  let h=`<div class="cards">${card('Bevétel ('+year+')',inc(null))}${card('Kiadás ('+year+')',exp(null))}${card('Egyenleg ('+year+')',bal(null),true)}</div>`;
  h+=chart();
  h+=`<div class="muted" style="margin:0 0 6px">A tételnevek a kiválasztott hónapra ({MON[m]}) vonatkoznak, a többi hónap neve nem változik.</div><div class="tablewrap"><table><thead><tr><th>Tétel</th>${MS.map(x=>`<th>${x}</th>`).join('')}<th>Össz</th></tr></thead><tbody>`;
  for(const [g,label] of GROUPS){
    h+=`<tr class="gh"><td colspan="14">${label}</td></tr>`;
    for(const i of items().filter(x=>x.group===g)){
      h+=`<tr><td><input type="text" data-name="${i.id}" data-nm="${m}" value="${esc(nameOf(i,m))}" style="width:190px" aria-label="Tétel neve" title="Név: ${MON[m]}"> <button class="danger" data-act="del" data-id="${i.id}" title="Törlés" style="padding:0 5px">✕</button></td>`;
      for(let k=0;k<12;k++)h+=`<td><input type="number" inputmode="decimal" step="any" data-id="${i.id}" data-m="${k}" value="${i.vals[k]==null?'':i.vals[k]}"></td>`;
      h+=`<td class="num">${fmtN(rowSum(i))}</td></tr>`;
    }
    if(g!=='info')h+=`<tr class="tot"><td>Összesen – ${label}</td>${cells(i=>gsum(g,i))}</tr>`;
  }
  h+=`<tr class="tot"><td>Bevétel összesen</td>${cells(i=>inc(i))}</tr>`;
  h+=`<tr class="tot"><td>Kiadás összesen</td>${cells(i=>exp(i))}</tr>`;
  h+=`<tr class="tot"><td>Egyenleg</td>${cells(i=>bal(i))}</tr>`;
  return h+`</tbody></table></div>`;
}

function addForm(){
  return `<div class="panel"><h2>Új tétel (${year})</h2><div class="add"><input type="text" id="nName" placeholder="Név, pl. Netflix" aria-label="Tétel neve"><select id="nGroup" aria-label="Csoport">${GROUPS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><button data-act="add">Hozzáadás</button></div><div class="muted">Az új tétel üresen jön létre, az értékeket a hónapos mezőkbe írhatod.</div></div>`;
}

function subsPanel(){
  const list=st.subs.map((s,i)=>`<div class="row"><input type="text" class="nm" data-subname="${i}" value="${esc(s.n)}" aria-label="Előfizetés neve"><span><input type="number" inputmode="decimal" step="any" data-sub="${i}" value="${s.e}" style="width:90px"> €</span><button class="danger" data-act="subdel" data-i="${i}" title="Törlés">✕</button></div>`).join('');
  const total=st.subs.reduce((a,s)=>a+(+s.e||0),0);
  return `<div class="panel"><h2>Előfizetések</h2>${list}<div class="sub"><span>Összesen</span><span>${total} €</span></div><div class="add"><input type="text" id="sName" placeholder="Név" aria-label="Előfizetés neve"><input type="number" inputmode="decimal" id="sAmt" placeholder="€" style="width:90px" aria-label="Összeg €"><button data-act="subadd">Hozzáadás</button></div></div>`;
}

// Hitel (Részlet) automatikusan követi a bank „Havi részlet” sorát, ahol van ott érték
function syncHitel(){
  for(const y of [2026,2027]){
    const r=st[y].items.find(x=>x.id==='reszlet');
    const h=st[y].items.find(x=>x.id==='havireszlet');
    if(!r||!h)continue;
    for(let k=0;k<12;k++)if(h.vals[k]!=null)r.vals[k]=h.vals[k];
  }
}
// Bank egyenleg: a nyitóegyenlegtől (2026 július) minden hónapban levonja a csökkentés összegét
function syncBank(){
  const seq=[];
  for(let k=7;k<12;k++)seq.push([2026,k]);
  for(let k=0;k<12;k++)seq.push([2027,k]);
  let prev=null;
  for(const [y,k] of seq){
    const b=st[y].items.find(x=>x.id==='bank');
    const c=st[y].items.find(x=>x.id==='csokentes');
    if(!b||!c)continue;
    if(prev===null){prev=b.vals[k];continue;}
    b.vals[k]=prev-(c.vals[k]||0);
    prev=b.vals[k];
  }
}
// Havi részlet (bank): 2026 októbertől havonta 44 lei csökken (szeptemberi értéktől indul)
const resztLep=()=>(st.resztLep??44);
function syncInstallment(){
  const seq=[];
  for(let k=9;k<12;k++)seq.push([2026,k]);
  for(let k=0;k<12;k++)seq.push([2027,k]);
  let prev=st[2026].items.find(x=>x.id==='havireszlet')?.vals[8];
  if(prev==null)return;
  for(const [y,k] of seq){
    const h=st[y].items.find(x=>x.id==='havireszlet');
    if(!h)continue;
    h.vals[k]=prev-resztLep();
    prev=h.vals[k];
  }
}
function render(){
  syncInstallment();
  syncHitel();
  syncBank();
  document.getElementById('year').value=year;
  document.querySelectorAll('[data-act="mode"]').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
  app.innerHTML=(mode==='ho'?hoView()+quickForm():tableView())+laciPanel()+addForm()+subsPanel();
}

// Laci elszámolás: Gerda teljes + Zente fele = Laci havi részesedése.
// Az elmaradás havonta halmozódik, a Laci extra befizetéseit (laciPay) levonja.
const sumG=(y,g,mi)=>st[y].items.filter(i=>i.group===g).reduce((a,i)=>a+(i.vals[mi]||0),0);
const laciOwed=(y,mi)=>(sumG(y,'gerda',mi)+sumG(y,'zente',mi))/2;
// Tartásdíj (lacitart) csak tájékoztató, az elmaradást nem csökkenti
const tart=(y,k)=>{const i=st[y].items.find(x=>x.id==='lacitart');return i?(i.vals[k]||0):0;};
const laciPaid=(y,k)=>(st[y].laciPay[k]||0);
function laciBal(y,mi){
  const from=st.laciFrom; // {y,m}: ettől a hónaptól indul újra az elszámolás
  let bal=from?0:(st[2026].laciOpen||0);
  let started=!from;
  for(const yy of [2026,2027])for(let k=0;k<12;k++){
    if(yy===y&&k>mi)return bal;
    if(!started){if(yy===from.y&&k===from.m)started=true;else continue;}
    bal+=laciOwed(yy,k)-laciPaid(yy,k);
  }
  return bal;
}
function laciPanel(){
  const rows=MON.map((n,k)=>{
    const g=sumG(year,'gerda',k), z=sumG(year,'zente',k);
    const cur=k===m?'font-weight:700':'';
    return `<tr style="${cur}"><td>${n}</td><td class="num">${fmtN(g)}</td><td class="num">${fmtN(z)}</td><td class="num">${fmtN(g+z)}</td><td class="num">${fmtN(laciOwed(year,k))}</td><td class="num">${fmtN(tart(year,k))}</td><td><input type="number" inputmode="decimal" step="any" data-lpay="${k}" value="${st[year].laciPay[k]==null?'':st[year].laciPay[k]}"></td><td class="num ${laciBal(year,k)>0?'neg':'pos'}">${fmt(laciBal(year,k))}</td></tr>`;
  }).join('');
  return `<div class="panel"><h2>Laci elszámolás <span class="muted">(Gerda + Zente összege, kettéosztva: a fele a tiéd, a fele Laci-é)</span></h2>
    <div class="cards" style="margin-bottom:10px"><div class="card"><div class="l">Laci elmaradás · ${MON[m]} végén</div><div class="v ${laciBal(year,m)>0?'neg':'pos'}">${fmt(laciBal(year,m))}</div></div><div class="card"><div class="l">Kezdő elmaradás (2026 január előtt)</div><div style="margin-top:6px"><input type="number" inputmode="decimal" step="any" id="laciOpen" value="${st[2026].laciOpen||0}" style="width:130px"> lei</div></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px"><button data-act="laciReset">Újrakezdés innen (${MON[m]} ${year})</button>${st.laciFrom?`<span class="muted">Elszámolás ${MON[st.laciFrom.m]} ${st.laciFrom.y}-tól</span><button data-act="laciRestore">Teljes előzmény</button>`:""}</div>
    <div class="tablewrap"><table style="min-width:620px"><thead><tr><th>Hó</th><th>Gerda</th><th>Zente</th><th>Gerda + Zente</th><th>Laci fele</th><th>Tartásdíj (nem számít bele)</th><th>Extra befizetés</th><th>Elmaradás</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted">A tartásdíj nem számít bele az elmaradásba, az extra befizetést havonta írd be. Az elmaradás a következő hónapba is átvitelre kerül, a 2027-es év a 2026-os végösszegből indul.</div></div>`;
}

// Gyors rögzítés: a kiválasztott hónapra írja az összeget, meglévő tételt frissít
function quickForm(){
  const names=[...new Set(items().map(i=>i.name))];
  return `<div class="panel"><h2>Gyors rögzítés · ${MON[m]} ${year}</h2><div class="add"><select id="qGroup" aria-label="Csoport">${GROUPS.filter(([k])=>k!=='info').map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input type="text" id="qName" list="qNames" placeholder="Név" aria-label="Név"><datalist id="qNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><input type="number" inputmode="decimal" step="any" id="qAmt" placeholder="Összeg (lei)" style="width:140px" aria-label="Összeg"><button data-act="quick">Rögzítés</button></div><div class="muted">Ha ugyanilyen nevű tétel már van ebben a csoportban, annak a hónapos értékét írja felül.</div></div>`;
}

// Kártyák húzása: a fogantyút (⠿) megfogva a kártyát egy másik kártya elé lehet tenni
let dragKey=null;
app.addEventListener('dragstart',e=>{
  const h=e.target.closest('.handle');if(!h)return;
  const p=h.closest('[data-panel]');dragKey=p.dataset.panel;
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragKey);
  p.classList.add('dragging');
});
app.addEventListener('dragover',e=>{
  if(!dragKey)return;
  const p=e.target.closest('[data-panel]');if(!p)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  if(p.dataset.panel!==dragKey)p.classList.add('drop-target');
});
app.addEventListener('drop',e=>{
  if(!dragKey)return;
  e.preventDefault();
  const p=e.target.closest('[data-panel]');
  if(p&&p.dataset.panel!==dragKey){
    const order=st.order.filter(k=>k!==dragKey);
    order.splice(order.indexOf(p.dataset.panel),0,dragKey);
    st.order=order;save();
  }
  dragKey=null;render();
});
app.addEventListener('dragend',()=>{dragKey=null;render();});

function download(name,type,content){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function toCSV(){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const head=['Csoport','Tétel',...MON,'Összesen'].map(q).join(';');
  const lines=[head];
  for(const [g,label] of GROUPS){
    for(const i of items().filter(x=>x.group===g))
      lines.push([label,i.name,...i.vals.map(v=>v==null?'':v),rowSum(i)].map(q).join(';'));
  }
  const tot=(name,fn)=>lines.push(['',name,...[...Array(12).keys()].map(fn),fn(null)].map(q).join(';'));
  tot('Bevétel összesen',i=>inc(i));
  tot('Kiadás összesen',i=>exp(i));
  tot('Egyenleg',i=>bal(i));
  return '﻿'+lines.join('\n');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act;
  if(a==='mode'){mode=b.dataset.v;}
  else if(a==='prev'){m=(m+11)%12;}
  else if(a==='next'){m=(m+1)%12;}
  else if(a==='imp'){document.getElementById('file').click();return;}
  else if(a==='exp'){download(`penzugy-${year}.json`,'application/json',JSON.stringify(st,null,2));return;}
  else if(a==='csv'){download(`penzugy-${year}.csv`,'text/csv;charset=utf-8',toCSV());return;}
  else if(a==='del'){
    const i=items().find(x=>x.id===b.dataset.id);
    if(!i)return;
    if(b.dataset.mo!==undefined){
      // havi nézet: csak ebből a hónapból veszi ki, az éves nézetben megmarad
      i.vals[m]=null;
      if(i.names)i.names[m]=null;
    }else{
      // éves tábla: a teljes tételt törli
      if(!confirm(`Törlöd ezt a tételt az egész évből: ${i.name}?`))return;
      st[year].items=items().filter(x=>x!==i);
    }
  }
  else if(a==='laciReset'){
    st.laciFrom={y:year,m:m};
  }
  else if(a==='laciRestore'){st.laciFrom=null;}
  else if(a==='quick'){
    const group=document.getElementById('qGroup').value;
    const name=document.getElementById('qName').value.trim();
    const raw=document.getElementById('qAmt').value.trim();
    const amt=Number(raw.replace(',','.'));
    if(!name||raw===''||isNaN(amt))return;
    const ex=items().find(x=>x.group===group&&x.name.toLowerCase()===name.toLowerCase());
    if(ex){ex.vals[m]=amt;}
    else{const n=it('i'+Date.now(),name,group,Array(12).fill(null));n.vals[m]=amt;items().push(n);}
  }
  else if(a==='add'){
    const name=document.getElementById('nName').value.trim();
    if(!name)return;
    items().push(it('i'+Date.now(),name,document.getElementById('nGroup').value,Array(12).fill(null)));
  }
  else if(a==='subadd'){
    const name=document.getElementById('sName').value.trim();
    const amt=Number(document.getElementById('sAmt').value);
    if(!name)return;
    st.subs.push({n:name,e:isNaN(amt)?0:amt});
  }
  else if(a==='subdel'){
    const s=st.subs[+b.dataset.i];
    if(!s||!confirm(`Törlöd: ${s.n}?`))return;
    st.subs.splice(+b.dataset.i,1);
  }
  else if(a==='reset'){
    if(!confirm('Visszaáll az eredeti sheet-adatokra? Minden módosítás elvész.'))return;
    st=clone(SEED);
  }
  save();render();
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='year'){year=+t.value;render();return;}
  if(t.dataset.role==='month'){m=+t.value;render();return;}
  if(t.id==='file'){
    const f=t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d[2026]||!d[2027]||!Array.isArray(d.subs))throw new Error('format');
        st=d;ensureData();save();render();
      }catch(err){alert('Ez a fájl nem megfelelő formátumú.');}
    };
    r.readAsText(f);t.value='';return;
  }
  if(t.dataset.id!==undefined){
    const i=items().find(x=>x.id===t.dataset.id);
    const s=t.value.replace(',','.').trim();
    const v=s===''?null:Number(s);
    if(i)i.vals[+t.dataset.m]=(v===null||isNaN(v))?null:v;
    save();render();return;
  }
  if(t.dataset.subname!==undefined){
    const sub=st.subs[+t.dataset.subname];
    const v=t.value.trim();
    if(sub&&v)sub.n=v;
    save();render();return;
  }
  if(t.dataset.name!==undefined){
    const i=items().find(x=>x.id===t.dataset.name);
    const v=t.value.trim();
    if(i&&v){i.names=i.names||Array(12).fill(null);i.names[+t.dataset.nm]=v;}
    save();render();return;
  }
  if(t.dataset.lpay!==undefined){
    const v=t.value.trim()===''?null:Number(t.value.replace(',','.'));
    st[year].laciPay[+t.dataset.lpay]=(v===null||isNaN(v))?null:v;
    save();render();return;
  }
  if(t.id==='resztLep'){
    const v=Number(t.value.replace(',','.'));
    st.resztLep=isNaN(v)?0:v;
    save();render();return;
  }
  if(t.id==='laciOpen'){
    const v=Number(t.value.replace(',','.'));
    st[2026].laciOpen=isNaN(v)?0:v;
    save();render();return;
  }
  if(t.dataset.sub!==undefined){
    const s=st.subs[+t.dataset.sub];
    const v=Number(t.value.replace(',','.'));
    if(s)s.e=isNaN(v)?0:v;
    save();render();
  }
});

// ---------- Pontrács ----------
(() => {
  const cv = document.querySelector(".dots"), ctx = cv.getContext("2d");
  const GAP = 22, RADIUS = 150, PUSH = 7;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let dpr, w, h, cols, rows, ox, oy, energy, base = "#c9cdd4", dark = false;
  let mx = -1e4, my = -1e4, raf = 0, last = 0;

  function readTheme() {
    dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    base = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || base;
  }
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / GAP) + 1; rows = Math.ceil(h / GAP) + 1;
    ox = (w - (cols - 1) * GAP) / 2; oy = (h - (rows - 1) * GAP) / 2;
    energy = new Float32Array(cols * rows);
    draw(0, 0);
  }
  // Minden pontnak "energiája" van: az egér közelében 1, utána kb. 1 mp alatt cseng le, így csík marad utána.
  function draw(dt, t) {
    ctx.clearRect(0, 0, w, h);
    const decay = Math.pow(0.04, dt / 1000);
    let busy = false;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = j * cols + i, x = ox + i * GAP, y = oy + j * GAP;
      const dx = x - mx, dy = y - my, d = Math.hypot(dx, dy);
      let near = d < RADIUS ? 1 - d / RADIUS : 0;
      near = near * near * (3 - 2 * near);
      const e = energy[k] = Math.max(near, energy[k] * decay);
      let px = x, py = y;
      if (near > 0 && d > .01) { px += dx / d * PUSH * near; py += dy / d * PUSH * near; }
      if (e < .01) {
        ctx.globalAlpha = 1; ctx.fillStyle = base;
        ctx.fillRect(px - .9, py - .9, 1.8, 1.8);
        continue;
      }
      busy = true;
      const r = .9 + 1.4 * e;
      const hue = (x * 1.1 + y * .7 + t * .08) % 360;
      ctx.globalAlpha = .25 + .75 * e;
      ctx.fillStyle = `hsl(${hue} ${dark ? 85 : 80}% ${dark ? 68 : 58}%)`;
      ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    return busy;
  }
  function loop(t) {
    const dt = last ? Math.min(t - last, 50) : 16; last = t;
    raf = draw(dt, t) ? requestAnimationFrame(loop) : 0; // nyugalomban nem rajzol
    if (!raf) last = 0;
  }
  function kick() { if (!raf && !still && !document.hidden) raf = requestAnimationFrame(loop); }
  addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
  addEventListener("pointerdown", (e) => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { mx = my = -1e4; kick(); });
  addEventListener("blur", () => { mx = my = -1e4; kick(); });
  addEventListener("resize", size);
  new MutationObserver(() => { readTheme(); draw(0, performance.now()); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  readTheme(); size();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); draw(0, performance.now()); });
})();

render();
</script>
